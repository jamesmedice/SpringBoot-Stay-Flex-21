#must use context path
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-gateway
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /user-v1
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /order-v1
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80
          - path: /payment-v1
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 80