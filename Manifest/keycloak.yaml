---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak-ns
  labels:
    name: keycloak
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      name: keycloak
      labels:
        app: keycloak
        name: keycloak
    spec:
      restartPolicy: Always
      containers:
      - name: keycloak
        image: keycloak/keycloak:26.3
        imagePullPolicy: IfNotPresent
        args:
          - "start-dev" 
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: 800m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        env:
          - name: KC_LOG_LEVEL
            value: "DEBUG"
          - name: PROXY_ADDRESS_FORWARDING
            value: "true"
          - name: KEYCLOAK_ADMIN
            value: "admin"
          - name: KEYCLOAK_ADMIN_PASSWORD
            value: "admin"
        envFrom:
          - configMapRef:
              name: keycloak-config

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak-ns
  labels:
    app: keycloak
    name: keycloak
spec:
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 8080
      nodePort: 30080
  selector:
    app: keycloak
    name: keycloak