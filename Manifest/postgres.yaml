apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pv-claim
  namespace: default
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgresql-pv-volume
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/var/lib/postgresql/data"   # Make sure this exists on the node
    type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: default
  labels:
    app: postgresql
data:
  POSTGRES_DB: groupstelar
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: postgresql
  namespace: default
spec: 
  replicas: 1
  selector: 
    matchLabels: 
      app: postgresql
  template: 
    metadata: 
      labels: 
        app: postgresql
    spec: 
      securityContext:
        fsGroup: 999 
      containers: 
      - image: "postgres:latest"
        name: postgresql
        securityContext:
          runAsUser: 999
        envFrom: 
        - configMapRef: 
            name: postgres-config
        volumeMounts: 
          - name: persistent-storage
            mountPath: /var/lib/postgresql/data
      volumes: 
        - name: persistent-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: default
  labels:
    app: postgresql
spec:
  type: NodePort
  ports:
    - port: 5432
      nodePort: 30432
  selector:
    app: postgresql
