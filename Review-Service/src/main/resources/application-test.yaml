server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.h2.Driver
    password: admin
    url: "jdbc:h2:mem:~/db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS WORKFLOW\\;CREATE SCHEMA IF NOT EXISTS FINANCE;"
    username: admin
  h2:
    console:
      enabled: true
      path: /h2
  jackson:
    serialization.indent_output: true
  jpa:
    defer-datasource-initialization: true
    generate-ddl: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  sql:
    init:
      mode: always
      platform: h2