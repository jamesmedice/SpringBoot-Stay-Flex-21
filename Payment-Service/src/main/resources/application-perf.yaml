spring:
  datasource:
    url: "jdbc:postgresql://${DATABASE_HOST:postgres}:${DATABASE_PORT:5432}/${DATABASE_NAME:finance_db}"
    username: "${DB_USERNAME:default_user}"
    password: "${DB_PASSWORD:default_password}"
  jpa:
    database: POSTGRESQL
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        globally_quoted_identifiers: false
  sql:
    init:
      mode: always
      platform: postgres
